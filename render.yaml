services:
  - type: web
    name: frost-cartel-api
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: ADMIN_BOOTSTRAP_USER
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ROUND2_AUCTION_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: verify-full
      - key: PGSSLROOTCERT_CONTENT
        sync: false
