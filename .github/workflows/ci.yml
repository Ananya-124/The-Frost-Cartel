name: FROST CARTEL CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: Build, Lint, Test & Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frost_cartel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frost_cartel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/frost_cartel_test
      PG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/frost_cartel_test
      PGSSLMODE: disable

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Apply PostgreSQL Migrations to CI Database
        run: npm run db:migrate

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: TypeScript Validation
        run: npx tsc -b

      - name: Run Test Suites (Vitest)
        run: npm test

      - name: Compile and Bundle Production Artifacts
        run: npm run build

